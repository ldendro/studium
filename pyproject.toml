[project]
name = "studium"
version = "0.1.0"
description = "Studium vault storage core: read, parse, validate, and safely write Obsidian-compatible concept notes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "sqlalchemy>=2",
    "platformdirs>=4",
    "numpy>=2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.32",
    "pypdf>=6.16.2",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright[nodejs]>=1.1",
    "pre-commit>=3.7",
    "httpx>=0.28",
]
embeddings = [
    "sentence-transformers>=3",
]
vector-ext = [
    "sqlite-vec>=0.1.6",
]

[project.scripts]
studium = "studium.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studium"]

[tool.hatch.build.targets.wheel.force-include]
"evals/phase2/cases" = "studium/evaluate/cases"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--cov=studium --cov-report=term-missing -m 'not embedding and not vector_ext and not llm'"
markers = [
    "embedding: real local embedding-model tests (optional deps; opt-in via pytest -m embedding)",
    "vector_ext: optional sqlite-vec backend tests (uv sync --extra vector-ext)",
    "llm: live OpenAI-compatible local LLM server tests (opt-in via pytest -m llm)",
]

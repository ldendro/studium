<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Studium is a local-first workspace for constructing, connecting, reviewing, and retaining knowledge."
    />
    <meta name="theme-color" content="#0c1016" />
    <title>Studium — Learning Workspace</title>
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var target = event.target
          if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK')) return
          var root = document.getElementById('root')
          if (!root) return
          root.innerHTML =
            '<main style="min-height:100vh;display:grid;place-items:center;background:#0c1016;color:#edf0f4;font-family:system-ui,sans-serif;padding:2rem">' +
            '<div style="max-width:36rem"><p>Display problem</p>' +
            '<h1>Studium could not load its interface files.</h1>' +
            '<p>Use the local app address <code style="color:#deb66a">http://127.0.0.1:8765</code>, not a file on disk.</p>' +
            '<p>From the repository root:</p>' +
            '<p><code style="color:#deb66a">cd web && npm install && npm run build && cd .. && make app</code></p></div></main>'
        },
        true,
      )
    </script>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: #0c1016;
          color: #edf0f4;
          font-family: system-ui, sans-serif;
        "
      >
        <strong>Opening Studium</strong>
        <span style="color: #7f8b9b; font-size: 14px">Loading the local workspace…</span>
      </div>
    </div>
    <noscript>
      <main style="min-height:100vh;display:grid;place-items:center;background:#0c1016;color:#edf0f4;font-family:system-ui,sans-serif;padding:2rem">
        <p>Studium needs JavaScript enabled in this browser.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
